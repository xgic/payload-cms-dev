name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on new pushes (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write   # Required for Code Scanning SARIF upload

jobs:
  # ============================================
  # ShellCheck - Core strict linting
  # ============================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show ShellCheck version (apt)
        run: shellcheck --version || echo "ShellCheck not available yet"

      # 1. Reviewdog for excellent PR feedback + strict enforcement
      #    Pinned to release commit SHA for supply-chain security (best practice).
      #    Update the SHA periodically via Dependabot.
      - name: Run ShellCheck via reviewdog (warnings fail + PR annotations)
        uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1.32.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning                # Fail on warnings (very strict)
          fail_level: warning
          shellcheck_flags: >-
            --severity=warning
            --external-sources
            --enable=all

      # 2. Explicit run as defense-in-depth (guarantees job failure status)
      - name: Install ShellCheck (for local verification steps)
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Strict ShellCheck verification (fail on any warning+)
        run: |
          echo "::group::Strict ShellCheck"
          shellcheck \
            --severity=warning \
            --external-sources \
            --enable=all \
            .devcontainer/scripts/*.sh \
            .devcontainer/scripts/lib/*.sh
          echo "::endgroup::"
        shell: bash

      # 3. Generate and upload SARIF for GitHub Code Scanning (Security tab)
      #    Apt ShellCheck may not support --format=sarif; skip upload when unavailable.
      - name: Generate SARIF from ShellCheck
        id: sarif
        run: |
          set +e
          if shellcheck --help 2>&1 | grep -q sarif; then
            shellcheck \
              --severity=warning \
              --external-sources \
              --enable=all \
              --format=sarif \
              .devcontainer/scripts/*.sh > shellcheck-results.sarif
            sc_rc=$?
            if [ -s shellcheck-results.sarif ] && python3 -c "import json; json.load(open('shellcheck-results.sarif'))" 2>/dev/null; then
              echo "generated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ShellCheck SARIF output missing or invalid (exit $sc_rc); skipping upload"
          else
            echo "This ShellCheck build does not support SARIF; skipping upload"
          fi
          echo "generated=false" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload SARIF to GitHub (Code Scanning)
        if: steps.sarif.outputs.generated == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck-results.sarif
          category: shellcheck

  # ============================================
  # Matrix: Test against multiple ShellCheck versions
  # ============================================
  # Note: matrix expressions are not allowed in `uses:` (including docker://).
  # Run the image via docker CLI so version can come from the matrix.
  shellcheck-matrix:
    name: ShellCheck (Matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Docker Hub tags for koalaman/shellcheck (not bare version numbers)
        version: ['latest', 'stable']
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck ${{ matrix.version }}
        run: |
          docker run --rm \
            -v "$PWD:/mnt" \
            -w /mnt \
            "koalaman/shellcheck:${{ matrix.version }}" \
            --severity=warning \
            --external-sources \
            --enable=all \
            .devcontainer/scripts/*.sh \
            .devcontainer/scripts/lib/*.sh

  # ============================================
  # Additional Linters (Industry standard)
  # ============================================
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: any

  shfmt:
    name: shfmt (shell formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shfmt
        run: |
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: Check shell formatting (diff mode)
        run: |
          shfmt -i 2 -ci -bn -d \
            .devcontainer/scripts/*.sh \
            .devcontainer/scripts/lib/*.sh
        shell: bash

  # Optional but useful for YAML hygiene
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: ".github/"
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable

  # ------------------------------------------------------------------
  # Required ruleset gate (stable check name: "Lint")
  # GitHub required_status_checks match job names, not workflow paths.
  # ------------------------------------------------------------------
  lint:
    name: Lint
    if: always()
    needs:
      - shellcheck
      - shellcheck-matrix
      - actionlint
      - shfmt
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Require all lint jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.shellcheck.result }}" = "success"
          test "${{ needs.shellcheck-matrix.result }}" = "success"
          test "${{ needs.actionlint.result }}" = "success"
          test "${{ needs.shfmt.result }}" = "success"
          test "${{ needs.yamllint.result }}" = "success"
          echo "Lint gate passed"
