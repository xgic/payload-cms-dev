name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on new pushes (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-subprocess
          pip install -e .

      - name: Run tests with coverage (baseline from verification; soft floor)
        run: |
          # Baseline from verification on 0.1.0 (see AGENTS.md / testing docs).
          # Focus on the real xde core (legacy scripts retired).
          # Adjust threshold gradually as unit coverage on src/xde increases.
          python -m pytest \
            --cov=src/xde \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=50

      - name: Upload coverage report (artifact for PR review)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
