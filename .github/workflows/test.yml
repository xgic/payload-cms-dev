name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on new pushes (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install package and test deps (PyPI modular CLI)
        run: |
          # Consumer producer: install from PyPI pins via uv
          # https://github.com/xgic/ai/blob/main/docs/python-package-release.md
          # setup-uv@v7 installs uv + Python but does not create a project
          # venv; uv pip install requires an explicit environment.
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          # Template is a CLI consumer (no in-tree CLI package). Smoke tests
          # verify modular packages import; unit coverage lives in xgic/*-cli.
          uv run pytest -q

      - name: Smoke xgic CLI entrypoint
        run: |
          uv run xgic --version
          uv run xgic payload --help

  # ------------------------------------------------------------------
  # Required ruleset gate (stable check name: "Test")
  # GitHub required_status_checks match job names, not workflow paths.
  # ------------------------------------------------------------------
  test:
    name: Test
    if: always()
    needs:
      - python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all test jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.python-tests.result }}" = "success"
          echo "Test gate passed"
