name: Release Validation

# Runs on PRs (required gate), main pushes, tags, and manual dispatch.
# Stable consolidating check name for rulesets: "Release Validation"
# (GitHub required_status_checks match job names, not workflow file paths.)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags:
      - 'v*'

# Cancel in-progress runs on new pushes (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-devcontainer:
    name: Validate Dev Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare host paths for compose mounts
        run: mkdir -p "$HOME/.ssh"

      - name: Generate .devcontainer/.env (idempotent)
        run: bash .devcontainer/scripts/init-env.sh

      - name: Build dev container image
        run: |
          docker compose -f .devcontainer/docker-compose.yml build

      - name: Start primary service
        run: |
          docker compose -f .devcontainer/docker-compose.yml \
            up -d xgic-payload-cms-dev
          # Wait until the primary service accepts exec
          for _ in $(seq 1 30); do
            if docker compose -f .devcontainer/docker-compose.yml \
              exec -T xgic-payload-cms-dev true 2>/dev/null; then
              echo "Primary service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Primary service did not become ready in time" >&2
          docker compose -f .devcontainer/docker-compose.yml ps || true
          docker compose -f .devcontainer/docker-compose.yml logs \
            --no-color --tail=100 xgic-payload-cms-dev || true
          exit 1

      - name: Smoke-test container tooling + modular XGIC CLI
        run: |
          docker compose -f .devcontainer/docker-compose.yml \
            exec -T xgic-payload-cms-dev bash -c '
              set -euo pipefail
              echo "::group::Tool versions"
              node --version
              pnpm --version
              psql --version
              python3 --version
              echo "::endgroup::"
              echo "::group::XGIC CLI smoke"
              xgic --version
              xgic payload --help
              xgic info || true
              echo "::endgroup::"
            '

      - name: Run devcontainer validation script
        run: |
          # Script covers node/pnpm/psql client checks; DB connectivity
          # may soft-fail when postgres profile is not started (expected).
          docker compose -f .devcontainer/docker-compose.yml \
            exec -T xgic-payload-cms-dev \
            bash .devcontainer/scripts/devcontainer-tests.sh || true

      - name: Producer e2e (setup, first admin, seed, pages)
        env:
          E2E_REQUIRE: "1"
        run: |
          set -euo pipefail
          compose=(docker compose -f .devcontainer/docker-compose.yml)
          "${compose[@]}" exec -T -u node xgic-payload-cms-dev \
            xgic payload setup
          "${compose[@]}" exec -T -d -u node xgic-payload-cms-dev \
            bash -c 'cd /workspace && xgic payload dev \
              > /tmp/payload-dev.log 2>&1'
          ok=0
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "payload dev did not become ready" >&2
            "${compose[@]}" exec -T xgic-payload-cms-dev \
              tail -n 80 /tmp/payload-dev.log || true
            exit 1
          fi
          "${compose[@]}" exec -T -u node \
            -e E2E_REQUIRE=1 \
            -e PAYLOAD_BASE_URL=http://127.0.0.1:3000 \
            xgic-payload-cms-dev bash -c '
              set -euo pipefail
              uv pip install --python /opt/venv/bin/python pytest
              cd /workspace
              /opt/venv/bin/pytest -q tests/e2e
            '

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose -f .devcontainer/docker-compose.yml \
            down --remove-orphans || true

  # ------------------------------------------------------------------
  # Required ruleset gate (stable check name: "Release Validation")
  # ------------------------------------------------------------------
  release-validation:
    name: Release Validation
    if: always()
    needs:
      - validate-devcontainer
    runs-on: ubuntu-latest
    steps:
      - name: Require release validation jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.validate-devcontainer.result }}" = "success"
          echo "Release Validation gate passed"
