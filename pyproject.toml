[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xde"
version = "0.1.0"
description = """XGIC Dev Environment CLI - reliable replacement for
xde CLI + Docker Compose dev container orchestration for Payload CMS"""
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "XGIC", email = "dev@xgic.net"}
]
keywords = [
  "dev", "containers", "payload-cms", "docker-compose", "orchestration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.scripts]
xde = "xde.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "textual>=0.70",  # for optional tui
]

[tool.hatch.build.targets.wheel]
packages = ["src/xde"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# E501 (line too long) is intentionally NOT ignored for Python code files.
# See "Line Length (80 characters)" in .github/CONTRIBUTING.md for the full rule
# and justified exceptions (URLs, certain test data, generated schema strings, etc.).

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
