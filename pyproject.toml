[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xgic-payload-cms-dev"
version = "0.3.2"
description = "XGIC Payload CMS Dev Container producer (image + compose) — consumes modular XGIC CLI packages from PyPI."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "XGIC" }
]
# Thin consumer: no in-tree CLI. Install modular XGIC CLI from PyPI only
# (https://github.com/xgic/ai/blob/main/docs/python-package-release.md).
dependencies = [
    "xgic-cli>=0.2.0,<0.3",
    "xgic-dev-cli>=0.2.0,<0.3",
    "xgic-payload-cms-cli>=0.2.2,<0.3",
    "rich>=13.7",
    "pydantic>=2.7",
    "email-validator>=2.0",
]
keywords = [
    "xgic",
    "payload-cms",
    "dev-containers",
    "docker-compose",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.urls]
Homepage = "https://github.com/xgic/payload-cms-dev"
Repository = "https://github.com/xgic/payload-cms-dev"
Issues = "https://github.com/xgic/payload-cms-dev/issues"

# No Python packages in this template (CLI lives in modular public repos).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
