# Producer exemplar for the Docker Compose-first consumer contract.
# Consumers (thin template) attach via dockerComposeFile + service and pin
# ghcr.io/xgic/payload-cms-dev on this primary service—not standalone image:.
# Keep name:, container/volume/network names, XGIC_COMPOSE_PROJECT, and
# composeProjectName aligned when renaming.
name: xgic-payload-cms-dev
services:
  xgic-payload-cms-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
    # Start as root only long enough to fix the ssh-home named volume ownership
    # (Docker initializes empty named volumes as root:root). Then drop to node
    # for Git DX + keep-alive. VS Code still attaches as remoteUser node.
    # Do not put Git DX in devcontainer.json postAttach/postStart/postCreate.
    user: "0:0"
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /home/node/.ssh
        chown -R node:node /home/node/.ssh
        chmod 700 /home/node/.ssh
        if [ -f /workspace/.devcontainer/scripts/configure-git-dx.sh ]; then
          runuser -u node -- bash \
            /workspace/.devcontainer/scripts/configure-git-dx.sh --quiet
        fi
        exec runuser -u node -- tail -f /dev/null
    container_name: xgic-payload-cms-dev
    env_file: .env
    image: xgic-payload-cms-dev
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:delegated # Bind-mount source for live reload
      # Named volume for ~/.ssh (known_hosts; optional manual keys). Do NOT
      # bind-mount host $HOME/.ssh — under Docker, host HOME is often unset
      # and expands to /.ssh. Prefer HTTPS + VS Code credential helper, or
      # SSH agent forwarding (keys stay on the host).
      - ssh-home:/home/node/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
      - vscode-srv-ext:/home/node/.vscode-server/extensions

  postgres:
    container_name: xgic-payload-cms-dev-postgres
    env_file: .env
    image: postgres:18.4 # Latest stable as of May 2026
    networks:
      - app-network
    profiles:
      - postgres
    volumes:
      - postgres-data:/var/lib/postgresql # Persistent volume (best practice)

  mongodb:
    container_name: xgic-payload-cms-dev-mongodb
    image: mongo:7.0
    networks:
      - app-network
    profiles:
      - mongodb
    volumes:
      - mongodb-data:/data/db

volumes:
  postgres-data:
    name: xgic-payload-cms-dev-postgres-data
  mongodb-data:
    name: xgic-payload-cms-dev-mongodb-data
  vscode-srv-ext:
    name: xgic-payload-cms-dev-vscode-srv-ext
  ssh-home:
    name: xgic-payload-cms-dev-ssh-home

networks:
  app-network:
    driver: bridge # Isolated network
    name: xgic-payload-cms-dev
