name: xgic-payload-cms-dev-containers
services:
  xgic-payload-cms-dev-containers:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
    command: tail -f /dev/null
    container_name: xgic-payload-cms-dev-containers
    env_file: .env
    image: xgic-payload-cms-dev-containers
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:delegated # Bind-mount source for live reload
      - $HOME/.ssh:/home/node/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
      - vscode-srv-ext:/home/node/.vscode-server/extensions

  postgres:
    container_name: xgic-payload-cms-dev-containers-postgres
    env_file: .env
    image: postgres:18.4 # Latest stable as of May 2026
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql # Persistent volume (best practice)

volumes:
  postgres-data:
    name: xgic-payload-cms-dev-containers-postgres-data
  vscode-srv-ext:
    name: xgic-payload-cms-dev-containers-vscode-srv-ext

networks:
  app-network:
    driver: bridge # Isolated network
    name: xgic-payload-cms-dev-containers
